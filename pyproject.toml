[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "octop-mini"
version = "0.1.0"
description = "Teaching lab: incremental Octop skeleton (M0)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]

[dependency-groups]
dev = ["httpx>=0.27", "pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/mini"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]